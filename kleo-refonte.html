<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KLÉO — Hygiène & HACCP</title>
<meta name="theme-color" content="#06090C">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06090C; --surface:rgba(255,255,255,.03); --surface2:rgba(255,255,255,.05);
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.12);
  --txt:#EAF2F0; --txt2:rgba(234,242,240,.55); --txt3:rgba(234,242,240,.4);
  --mint:#3CF0AC; --mint2:#4BF7B4; --teal:#0FB6A8; --mintt:#8CFFD6;
  --warn:#F5B14C; --warnt:#F5C989; --alert:#FF6B6B; --alertt:#FF9E9E;
  --grad:linear-gradient(135deg,#4BF7B4,#0FB6A8);
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(1300px 760px at 12% -8%,rgba(15,182,168,.12),transparent 58%),
    radial-gradient(1100px 820px at 105% 6%,rgba(60,240,172,.07),transparent 55%),
    var(--bg);
  color:var(--txt); font-family:'Space Grotesk',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
::selection{background:rgba(60,240,172,.28)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
@keyframes floatUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes checkPop{0%{transform:scale(.3);opacity:0}55%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
@keyframes confFall{0%{transform:translateY(-10px) rotate(0);opacity:0}20%{opacity:1}100%{transform:translateY(140px) rotate(220deg);opacity:0}}
@keyframes ringspin{to{transform:rotate(360deg)}}

/* ---------- Shell ---------- */
.app{display:flex;height:100vh;height:100dvh}
.rail{
  width:98px;flex:0 0 98px;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.01));
  border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;
  padding:22px 0;gap:6px;overflow-y:auto;scrollbar-width:none;
}
.rail::-webkit-scrollbar{display:none}
.rail .brand{margin-bottom:14px}
.rail .navlist{display:flex;flex-direction:column;gap:4px;width:100%;align-items:center}
.navitem{
  width:74px;padding:11px 0;border-radius:15px;display:flex;flex-direction:column;align-items:center;gap:6px;
  color:var(--txt3);transition:all .16s;position:relative;
}
.navitem svg{width:22px;height:22px;stroke-width:1.7}
.navitem span{font-size:10.5px;letter-spacing:.01em;text-align:center;line-height:1.1}
.navitem:hover{color:var(--txt2);background:rgba(255,255,255,.03)}
.navitem.active{color:#05130F;background:var(--grad);box-shadow:0 8px 22px rgba(15,182,168,.32)}
.navitem.active svg{stroke:#05130F}

.main{flex:1;overflow-y:auto;scroll-behavior:smooth}
.screen{min-height:100%;padding:34px 40px 60px;animation:floatUp .45s ease both;max-width:1280px}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px;gap:20px;flex-wrap:wrap}
.head h1{font-size:29px;font-weight:600;letter-spacing:-.01em}
.head .sub{font-size:14px;color:var(--txt2);margin-top:3px}

/* ---------- Bits ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:8px 15px;border-radius:100px;font-size:13px;border:1px solid var(--line);background:var(--surface2);color:var(--txt2)}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
.btn{padding:14px 22px;border-radius:14px;background:var(--grad);color:#05130F;font-size:15px;font-weight:600;box-shadow:0 10px 28px rgba(15,182,168,.35);display:inline-flex;align-items:center;gap:9px;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--surface2);border:1px solid var(--line2);color:var(--txt);box-shadow:none}
.btn:disabled{background:var(--surface2);color:var(--txt3);box-shadow:none;cursor:not-allowed}
.grid{display:grid;gap:16px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--txt3)}
.seg{display:flex;padding:4px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-size:13px}
.seg div{padding:7px 15px;border-radius:9px;color:var(--txt2)}
.seg div.on{background:linear-gradient(135deg,rgba(75,247,180,.18),rgba(15,182,168,.06));color:var(--mintt);font-weight:500}
.ring{transform:rotate(-90deg)}
.status{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:100px;font-size:12px;font-weight:500}
.st-ok{background:rgba(60,240,172,.12);border:1px solid rgba(60,240,172,.3);color:var(--mintt)}
.st-warn{background:rgba(245,177,76,.12);border:1px solid rgba(245,177,76,.32);color:var(--warnt)}
.st-alert{background:rgba(255,107,107,.12);border:1px solid rgba(255,107,107,.35);color:var(--alertt)}

.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(30px);opacity:0;
  background:rgba(10,15,20,.95);border:1px solid rgba(60,240,172,.4);color:var(--mintt);
  padding:14px 22px;border-radius:14px;font-size:14px;display:flex;align-items:center;gap:10px;
  box-shadow:0 20px 50px rgba(0,0,0,.5);z-index:200;transition:all .35s cubic-bezier(.2,1,.4,1);pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* Assistant chat */
.chatwrap{display:flex;flex-direction:column;height:calc(100vh - 0px);max-width:860px;margin:0 auto}
.chathead{display:flex;align-items:center;gap:14px;padding:20px 4px 18px}
.chathead .av{width:46px;height:46px;border-radius:14px;background:var(--grad);display:flex;align-items:center;justify-content:center;flex:0 0 46px;box-shadow:0 8px 22px rgba(15,182,168,.32)}
.chathead .on{font-size:12px;color:var(--mintt);display:flex;align-items:center;gap:6px}
.chatlog{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:12px 4px 18px}
.msg{max-width:76%;padding:13px 16px;border-radius:18px;font-size:15px;line-height:1.5;white-space:pre-wrap;animation:floatUp .3s ease both}
.msg.user{align-self:flex-end;background:var(--grad);color:#05130F;border-bottom-right-radius:6px;font-weight:500}
.msg.bot{align-self:flex-start;background:var(--surface2);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.sys{align-self:center;background:rgba(60,240,172,.08);border:1px solid rgba(60,240,172,.25);color:var(--mintt);font-size:12.5px;padding:8px 14px;border-radius:100px}
.msg .tm{display:block;font-size:10px;opacity:.5;margin-top:5px;font-family:var(--mono)}
.chatquick{display:flex;gap:8px;flex-wrap:wrap;padding:0 4px 12px}
.chatquick button{padding:9px 14px;border-radius:100px;background:var(--surface2);border:1px solid var(--line2);color:var(--txt2);font-size:13px;cursor:pointer}
.chatquick button:hover{border-color:rgba(60,240,172,.4);color:var(--txt)}
.chatbar{display:flex;gap:10px;padding:12px 4px 20px;align-items:flex-end}
.chatbar textarea{flex:1;resize:none;min-height:52px;max-height:120px;padding:15px 18px;border-radius:16px;background:var(--surface2);border:1px solid var(--line);color:var(--txt);font-family:inherit;font-size:15px;outline:none}
.chatbar textarea:focus{border-color:rgba(60,240,172,.5)}
.chatbar .snd{width:52px;height:52px;flex:0 0 52px;border-radius:16px;background:var(--grad);display:flex;align-items:center;justify-content:center;cursor:pointer}
.typing{align-self:flex-start;display:flex;gap:4px;padding:14px 18px;background:var(--surface2);border:1px solid var(--line);border-radius:18px;border-bottom-left-radius:6px}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--txt3);animation:blink 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}

@media(max-width:820px){
  .rail{width:100%;flex:none;height:auto;flex-direction:row;border-right:none;border-top:1px solid var(--line);
    position:fixed;bottom:0;left:0;right:0;padding:8px 6px;gap:2px;z-index:100;overflow-x:auto;background:#080C10}
  .rail .brand{display:none}
  .rail .navlist{flex-direction:row;gap:2px}
  .navitem{width:auto;padding:8px 12px}.navitem span{font-size:9.5px}
  .app{flex-direction:column-reverse}
  .main{padding-bottom:80px}
  .screen{padding:24px 18px 40px}
  .head h1{font-size:23px}
}
</style>
</head>
<body>
<div class="app">
  <nav class="rail">
    <div class="brand" id="brand"></div>
    <div class="navlist" id="nav"></div>
  </nav>
  <main class="main" id="main"></main>
</div>
<div class="toast" id="toast"></div>

/* ===================== SEAL LOGO ===================== */
function seal(size){
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" style="display:block">
    <circle cx="50" cy="50" r="34" fill="none" stroke="#0FB6A8" stroke-width="1.6" stroke-dasharray="2.5 6.5" opacity=".75" style="transform-origin:center;animation:ringspin 26s linear infinite"/>
    <circle cx="50" cy="50" r="25" fill="url(#sg)"/>
    <path d="M40 51 l7 7 l14-17" stroke="#05130F" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4BF7B4"/><stop offset="1" stop-color="#0FB6A8"/></linearGradient></defs>
  </svg>`;
}
let _mk=0;
function mark(size){
  const id='mk'+(++_mk);

    <defs><linearGradient id="${id}g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4BF7B4"/><stop offset="1" stop-color="#0FB6A8"/></linearGradient>
    <mask id="${id}m"><rect width="100" height="100" fill="#000"/><circle cx="50" cy="50" r="42" fill="#fff"/><g fill="#000"><rect x="33.4" y="24" width="2" height="16" rx="1"/><rect x="36.7" y="24" width="2" height="16" rx="1"/><rect x="40" y="24" width="2" height="16" rx="1"/><path d="M33.4 33 h8.6 v2 a4.3 4.3 0 0 1 -4.3 4.3 a4.3 4.3 0 0 1 -4.3 -4.3 z"/><rect x="36" y="38" width="3.4" height="38" rx="1.7"/><path d="M49.2 24 c3.4 0 3.4 6 3.4 15 v9 h-3.4 z"/><rect x="49.2" y="47" width="3.4" height="29" rx="1.7"/><ellipse cx="63.4" cy="33" rx="5.4" ry="8.4"/><rect x="61.7" y="40" width="3.4" height="36" rx="1.7"/></g></mask></defs>
    <circle cx="50" cy="50" r="42" fill="url(#${id}g)" mask="url(#${id}m)"/>

}

function donut(pct,color,size,sw){
  const r=(size-sw)/2, c=2*Math.PI*r, off=c*(1-pct/100);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="${sw}"/><circle class="ring" style="transform-origin:center;transition:stroke-dashoffset .5s ease" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/></svg>`;
}
function toast(msg){const t=document.getElementById('toast');t.innerHTML=`<span style="width:20px;height:20px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center">${ico(ICONS.check).replace('stroke="currentColor"','stroke="#05130F"').replace('<svg','<svg width=11 height=11 style="stroke-width:3.5"')}</span>${msg}`;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2600)}
function parseNum(t){if(t===''||t==='-')return null;const n=parseFloat(t.replace(',','.'));return isNaN(n)?null:n}

        <div style="display:flex;align-items:center;gap:14px"><div style="flex:1;height:8px;border-radius:100px;background:rgba(255,255,255,.08);overflow:hidden"><div style="width:${n.conf}%;height:100%;background:${c.c}"></div></div><span class="mono" style="font-size:26px;font-weight:700;color:${c.t}">${n.conf}%</span></div>

/* ===================== RENDER + EVENTS ===================== */
function render(){document.getElementById('main').innerHTML=(V[route]||V.accueil)();if(route==='assistant')afterAssistant()}

document.addEventListener('click',e=>{
  const go_=e.target.closest('[data-go]'); if(go_ && go_.dataset.go){return go(go_.dataset.go)}
  const eq=e.target.closest('[data-eq]'); if(eq){S.equip=+eq.dataset.eq;S.temp='';S.action=null;save();return render()}
  const key=e.target.closest('[data-key]'); if(key){tapKey(key.dataset.key);return}
  if(e.target.closest('#del')){S.temp=S.temp.slice(0,-1);save();return render()}
  if(e.target.closest('#valider')){return validateTemp()}
  const act=e.target.closest('[data-act]'); if(act){S.action=act.dataset.act;save();return render()}
  const zone=e.target.closest('[data-zone]'); if(zone){const i=zone.dataset.zone;S.checks[i]=!S.checks[i];save();return render()}
  if(e.target.closest('#sign')){S.signed=true;pushLog({t:'12:04',label:'Plan de nettoyage signé',who:'Marie L.',tone:'ok'});save();render();toast('Nettoyage signé & horodaté')}
  if(e.target.closest('#generer')){S.generated=true;save();render();toast('Dossier PDF généré · empreinte scellée')}
  if(e.target.closest('#metierpick')){return openMetierPicker()}
  if(e.target.closest('#kioskgo')){return openKiosk()}
  if(e.target.closest('#chatsend')){const i=document.getElementById('chatinput');return sendChat(i?i.value:'')}
  const qk=e.target.closest('[data-quick]'); if(qk){return sendChat(qk.getAttribute('data-quick'))}
});
function selectMetier(k){S.metier=k;S.temp='';S.action=null;save();closeModal();render();toast('Profil « '+M().label+' » activé')}

function closeModal(){const m=document.getElementById('kleomodal');if(m)m.remove()}

    <div class="sub" style="margin-bottom:20px">Le cœur reste standardisé — seuls les seuils et zones s'adaptent au métier.</div>

        <div style="font-size:26px">${m.ic}</div><div style="font-size:15px;font-weight:600;margin-top:8px;color:${on?'var(--mintt)':'var(--txt)'}">${m.label}</div><div style="font-size:11px;color:var(--txt3);margin-top:2px">${m.equip.length} points · ${m.zones.length} zones</div>

function tapKey(k){
  let t=S.temp;
  if(k==='-'){t=t.startsWith('-')?t.slice(1):'-'+t}
  else if(k===','){if(t.includes(','))return;t=(t===''||t==='-')?t+'0,':t+','}
  else{if(t.replace('-','').replace(',','').length>=4)return;t=t+k}
  S.temp=t;save();render();
}
function validateTemp(){
  const e=EQ()[S.equip]||EQ()[0],num=parseNum(S.temp);if(num==null)return;
  const conf=e.hot?num>=e.th:num<=e.th;if(!conf&&!S.action)return;
  const val=S.temp.replace('.',',');
  pushLog({t:'12:0'+(Math.floor(Math.random()*9)),label:`Relevé ${e.name.toLowerCase()} · ${val} °C`,who:'Marie L.',tone:conf?'ok':'alert'});
  S.temp='';S.action=null;save();render();
  overlay(conf);
}
function overlay(conf){
  const o=document.createElement('div');
  o.style.cssText='position:fixed;inset:0;background:rgba(6,9,12,.82);backdrop-filter:blur(14px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;z-index:150';
  o.innerHTML=`<div style="animation:checkPop .5s cubic-bezier(.2,1.3,.5,1) both">${seal(140)}</div>
    <div style="text-align:center;animation:floatUp .5s .15s ease both"><div style="font-size:30px;font-weight:700">Relevé enregistré</div><div class="sub" style="font-size:15px;margin-top:6px">Horodaté & signé · journal inviolable</div></div>
    ${[['24%','32%',9,'#4BF7B4',1.4,0],['20%','52%',7,'#0FB6A8',1.6,.1],['26%','66%',8,'#8CFFD6',1.5,.2],['22%','44%',6,'#4BF7B4',1.7,.05]].map(c=>`<div style="position:absolute;top:${c[0]};left:${c[1]};width:${c[2]}px;height:${c[2]}px;background:${c[3]};border-radius:2px;animation:confFall ${c[4]}s ${c[5]}s ease-out both"></div>`).join('')}`;
  document.body.appendChild(o);
  setTimeout(()=>{o.style.transition='opacity .3s';o.style.opacity='0';setTimeout(()=>o.remove(),300)},2000);
}

let KS=null;
function openKiosk(){KS={step:'who',op:null,task:null,eq:0,temp:'',action:null};renderKiosk()}
function closeKiosk(){KS=null;const k=document.getElementById('kiosk');if(k)k.remove()}
function renderKiosk(){
  let el=document.getElementById('kiosk');

  el.style.cssText='position:fixed;inset:0;z-index:180;background:radial-gradient(900px 600px at 50% 12%,rgba(15,182,168,.12),transparent 60%),linear-gradient(160deg,#0A0F14,#060809);display:flex;flex-direction:column;animation:floatUp .3s ease both';
  el.innerHTML=kioskView();
}
function kBtn(attr,inner,extra){return `<button ${attr} style="border-radius:22px;background:var(--surface);border:1px solid var(--line);color:var(--txt);padding:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;cursor:pointer;transition:transform .1s;${extra||''}">${inner}</button>`}
function kioskView(){
  const steps=['who','task','do'];

    <div style="display:flex;align-items:center;gap:18px"><div style="display:flex;gap:6px;align-items:center">${bar}</div><button data-kquit style="padding:11px 20px;border-radius:12px;background:var(--surface2);border:1px solid var(--line2);color:var(--txt2);font-size:14px;cursor:pointer">Quitter</button></div>

    body=`<div style="text-align:center;margin-bottom:34px"><div class="eyebrow" style="margin-bottom:8px">Étape 1</div><div style="font-size:40px;font-weight:700;letter-spacing:-.02em">Qui es-tu&nbsp;?</div></div>

    body=`<div style="text-align:center;margin-bottom:34px"><div class="eyebrow" style="margin-bottom:8px">Étape 2 · ${KS.op}</div><div style="font-size:40px;font-weight:700;letter-spacing:-.02em">Quelle tâche&nbsp;?</div></div>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(200px,240px));justify-content:center;width:100%;max-width:960px">
      ${tasks.map(t=>kBtn(`data-ktask="${t[0]}"`,`<div style="width:78px;height:78px;border-radius:22px;background:linear-gradient(135deg,rgba(75,247,180,.2),rgba(15,182,168,.08));display:flex;align-items:center;justify-content:center;color:var(--mint2)">${ico(t[2]).replace('<svg','<svg width=38 height=38 style="stroke-width:1.7"')}</div><div style="font-size:20px;font-weight:600">${t[1]}</div>`,'padding:36px 26px')).join('')}

  }
  return header+`<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 40px 40px;min-height:0">${body}</div>`;

function kioskDo(){

        ${conf?`<div style="margin-top:16px;display:inline-flex;align-items:center;gap:10px;padding:12px 20px;border-radius:14px;background:rgba(60,240,172,.12);border:1px solid rgba(60,240,172,.4);color:var(--mintt);font-weight:600">${ico(ICONS.check).replace('<svg','<svg width=18 height=18 style="stroke-width:3"')}Conforme</div>`:''}
        ${ecart?`<div style="margin-top:16px;text-align:left"><div style="display:inline-flex;align-items:center;gap:10px;padding:12px 18px;border-radius:14px;background:rgba(255,107,107,.12);border:1px solid rgba(255,107,107,.45);color:#FFC9C9;font-weight:600;margin-bottom:12px">${ico(ICONS.alert).replace('<svg','<svg width=18 height=18 style="stroke-width:2"')}Écart · choisis une action</div>${acts.map(a=>`<button data-kact="${a}" style="display:flex;width:100%;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;margin-bottom:8px;cursor:pointer;font-size:14px;background:${KS.action===a?'rgba(255,107,107,.12)':'var(--surface)'};border:1px solid ${KS.action===a?'rgba(255,107,107,.5)':'var(--line2)'};color:${KS.action===a?'#FFD9D9':'var(--txt)'}">${KS.action===a?'●':'○'} ${a}</button>`).join('')}</div>`:''}
      </div>
      <div style="display:flex;flex-direction:column;gap:12px">

    </div>`;
  }
  if(KS.task==='nett'){
    const Z=ZN(); const done=Z.filter((z,i)=>KS['z'+i]).length;
    return `<div style="width:100%;max-width:720px">
      <div style="text-align:center;margin-bottom:24px"><div class="eyebrow">${KS.op} · nettoyage</div><div style="font-size:30px;font-weight:700;margin-top:6px">${done}/${Z.length} zones faites</div></div>
      <div style="display:flex;flex-direction:column;gap:10px">${Z.map((z,i)=>`<button data-kzone="${i}" style="display:flex;align-items:center;gap:16px;padding:16px 20px;border-radius:16px;cursor:pointer;text-align:left;background:${KS['z'+i]?'linear-gradient(90deg,rgba(60,240,172,.08),rgba(255,255,255,.015))':'var(--surface)'};border:1px solid ${KS['z'+i]?'rgba(60,240,172,.28)':'var(--line)'};color:var(--txt)"><span style="width:32px;height:32px;flex:0 0 32px;border-radius:9px;display:flex;align-items:center;justify-content:center;${KS['z'+i]?'background:var(--grad)':'border:2px solid rgba(255,255,255,.22)'}">${KS['z'+i]?ico(ICONS.check).replace('stroke="currentColor"','stroke="#05130F"').replace('<svg','<svg width=17 height=17 style="stroke-width:3.4"'):''}</span><div style="flex:1"><div style="font-size:16px;font-weight:500">${z.zone}</div><div class="sub" style="font-size:12px">${z.freq}</div></div></button>`).join('')}</div>
      <button data-kvalidate style="width:100%;margin-top:18px;padding:18px;border-radius:16px;border:none;background:var(--grad);color:#05130F;font-size:17px;font-weight:700;cursor:pointer">Signer &amp; valider</button>
    </div>`;
  }
  // dlc
  return `<div style="width:100%;max-width:520px;text-align:center">
    <div class="eyebrow">${KS.op} · nouvelle étiquette</div>
    <div style="font-size:30px;font-weight:700;margin:6px 0 24px">Étiquette DLC</div>
    <div class="card" style="padding:26px;text-align:left;display:flex;flex-direction:column;gap:14px">
      <div><div class="sub" style="font-size:12px;margin-bottom:6px">Produit</div><div style="padding:14px 16px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-size:16px">Saumon fumé</div></div>
      <div style="display:flex;gap:12px"><div style="flex:1"><div class="sub" style="font-size:12px;margin-bottom:6px">Fabriqué le</div><div class="mono" style="padding:14px 16px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-size:16px">12/07/2026</div></div><div style="flex:1"><div class="sub" style="font-size:12px;margin-bottom:6px">DLC (auto +3j)</div><div class="mono" style="padding:14px 16px;border-radius:12px;background:rgba(60,240,172,.08);border:1px solid rgba(60,240,172,.3);font-size:16px;color:var(--mintt)">15/07/2026</div></div></div>
    </div>
    <button data-kvalidate style="width:100%;margin-top:18px;padding:18px;border-radius:16px;border:none;background:var(--grad);color:#05130F;font-size:17px;font-weight:700;cursor:pointer">Imprimer &amp; enregistrer</button>
  </div>`;
}
function kioskClick(e){
  if(e.target.closest('[data-kquit]'))return closeKiosk();
  const op=e.target.closest('[data-kop]'); if(op){KS.op=op.dataset.kop;KS.step='task';return renderKiosk()}
  const tk=e.target.closest('[data-ktask]'); if(tk){KS.task=tk.dataset.ktask;KS.step='do';KS.eq=0;KS.temp='';KS.action=null;return renderKiosk()}
  const eq=e.target.closest('[data-keq]'); if(eq){KS.eq=+eq.dataset.keq;KS.temp='';KS.action=null;return renderKiosk()}
  const key=e.target.closest('[data-kkey]'); if(key){kioskTap(key.dataset.kkey);return}
  if(e.target.closest('[data-kdel]')){KS.temp=KS.temp.slice(0,-1);return renderKiosk()}
  const act=e.target.closest('[data-kact]'); if(act){KS.action=act.dataset.kact;return renderKiosk()}
  const zn=e.target.closest('[data-kzone]'); if(zn){KS['z'+zn.dataset.kzone]=!KS['z'+zn.dataset.kzone];return renderKiosk()}
  if(e.target.closest('[data-kvalidate]'))return kioskValidate();
}
function kioskTap(k){
  let t=KS.temp;
  if(k==='-'){t=t.startsWith('-')?t.slice(1):'-'+t}
  else if(k===','){if(t.includes(','))return;t=(t===''||t==='-')?t+'0,':t+','}
  else{if(t.replace('-','').replace(',','').length>=4)return;t=t+k}
  KS.temp=t;renderKiosk();
}
function kioskValidate(){
  if(KS.task==='temp'){
    const e=EQ()[KS.eq]||EQ()[0],num=parseNum(KS.temp);if(num==null)return;
    const conf=e.hot?num>=e.th:num<=e.th;if(!conf&&!KS.action)return;
    pushLog({t:'12:0'+(Math.floor(Math.random()*9)),label:`Relevé ${e.name.toLowerCase()} · ${KS.temp.replace('.',',')} °C`,who:KS.op,tone:conf?'ok':'alert'});
  } else if(KS.task==='nett'){
    pushLog({t:'12:0'+(Math.floor(Math.random()*9)),label:'Plan de nettoyage signé',who:KS.op,tone:'ok'});
    S.signed=true;
  } else {
    pushLog({t:'12:0'+(Math.floor(Math.random()*9)),label:'Étiquette DLC créée · Saumon fumé',who:KS.op,tone:'ok'});
  }
  save();
  kioskSuccess();
}
function kioskSuccess(){
  const el=document.getElementById('kiosk'); if(!el)return;
  el.innerHTML=`<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;position:relative">
    <div style="animation:checkPop .5s cubic-bezier(.2,1.3,.5,1) both">${seal(150)}</div>
    <div style="text-align:center;animation:floatUp .5s .15s ease both"><div style="font-size:34px;font-weight:700">C'est enregistré, merci&nbsp;!</div><div class="sub" style="font-size:16px;margin-top:6px">${KS.op} · horodaté &amp; signé · journal inviolable</div></div>
    ${[['26%','34%',9,'#4BF7B4',1.4,0],['22%','54%',7,'#0FB6A8',1.6,.1],['28%','64%',8,'#8CFFD6',1.5,.2]].map(c=>`<div style="position:absolute;top:${c[0]};left:${c[1]};width:${c[2]}px;height:${c[2]}px;background:${c[3]};border-radius:2px;animation:confFall ${c[4]}s ${c[5]}s ease-out both"></div>`).join('')}</div>`;
  setTimeout(()=>{ if(KS){KS.step='task';KS.temp='';KS.action=null;for(let i=0;i<8;i++)delete KS['z'+i];renderKiosk()} if(route==='accueil'||route==='calendrier'||route==='nettoyage')render();},2100);
}

/* ===================== ASSISTANT IA (démo, sans backend) ===================== */
function norm(s){return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
function nowLabel(){try{const d=new Date();return (''+d.getHours()).padStart(2,'0')+':'+(''+d.getMinutes()).padStart(2,'0')}catch(e){return ''}}
function escapeHtml(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function findTemp(t){const m=norm(t).replace(/moins\s+/g,'-').match(/-?\d+(?:[.,]\d+)?/);return m?parseFloat(m[0].replace(',','.')):null}
function matchList(t,arr,key){const n=norm(t);let best=null,sc=0;arr.forEach((it,i)=>{const words=norm(it[key]).split(/[^a-z]+/).filter(w=>w.length>3);let s=0;words.forEach(w=>{if(n.includes(w.slice(0,Math.min(6,w.length))))s++});if(/congel/.test(n)&&/congel/.test(norm(it[key])))s+=2;if(/frigo/.test(n)&&/chambre froide/.test(norm(it[key])))s+=2;if(s>sc){sc=s;best={it,i}}});return sc>0?best:null}
function findEquip(t){const r=matchList(t,EQ(),'name');return r?{e:r.it,i:r.i}:null}
function findZone(t){const r=matchList(t,ZN(),'zone');return r?{z:r.it,i:r.i}:null}

function renderChatLog(){
  const el=document.getElementById('chatlog');if(!el)return;
  el.innerHTML=(S.chat||[]).map(m=>{
    if(m.r==='sys')return `<div class="msg sys">✓ ${escapeHtml(m.t)}</div>`;
    return `<div class="msg ${m.r==='user'?'user':'bot'}">${escapeHtml(m.t)}<span class="tm">${m.tm||''}</span></div>`;
  }).join('');
  el.scrollTop=el.scrollHeight;
}
function afterAssistant(){renderChatLog();const i=document.getElementById('chatinput');if(i)i.focus()}
function showTyping(){const el=document.getElementById('chatlog');if(!el)return;const d=document.createElement('div');d.className='typing';d.id='typing';d.innerHTML='<span></span><span></span><span></span>';el.appendChild(d);el.scrollTop=el.scrollHeight}
function hideTyping(){const d=document.getElementById('typing');if(d)d.remove()}
function botSay(t){S.chat.push({r:'bot',t,tm:nowLabel()})}
function botSys(t){S.chat.push({r:'sys',t})}
function finishBot(){save();renderChatLog()}

function sendChat(text){
  text=(text||'').trim();if(!text||!S.chat)return;
  const i=document.getElementById('chatinput');if(i)i.value='';
  S.chat.push({r:'user',t:text,tm:nowLabel()});renderChatLog();save();
  showTyping();
  setTimeout(()=>{hideTyping();botRespond(text)},680);
}
function botRespond(text){
  const p=S.chatPending, low=norm(text);
  if(p&&p.type==='need-action'){
    pushLog({t:nowLabel(),label:'Action corrective · '+text+' ('+p.eqName+')',who:CONFIG.manager||'Vous',tone:'ok'});
    botSay('✅ Action enregistrée : « '+text+' ». L’écart est clôturé et tracé dans le journal inviolable.');
    S.chatPending=null;return finishBot();
  }
  if(p&&p.type==='need-temp'){
    const tv=findTemp(text);
    if(tv==null){botSay('Je n’ai pas saisi la température 🤔 Donnez-moi juste le chiffre, par ex. « 3 » ou « -18 ».');return finishBot();}
    S.chatPending=null;return processReading(p.eq,tv);
  }
  const temp=findTemp(text), eq=findEquip(text);
  if(eq&&temp!=null)return processReading(eq.e,temp);
  if(eq&&temp==null){S.chatPending={type:'need-temp',eq:eq.e};botSay('Bien reçu pour '+eq.e.name+'. Quelle température avez-vous relevée ?');return finishBot();}
  if(/nettoy|nettoie|propre|\blav/.test(low)){
    const z=findZone(text);
    if(z){S.checks[z.i]=true;pushLog({t:nowLabel(),label:'Nettoyage · '+z.z.zone,who:CONFIG.manager||'Vous',tone:'ok'});botSay('✅ « '+z.z.zone+' » marqué comme nettoyé. Bien joué !');botSys('Plan de nettoyage & journal mis à jour');return finishBot();}
    botSay('Quelle zone avez-vous nettoyée ? (ex. plan de travail, sol cuisine, chambre froide…)');return finishBot();
  }
  if(/etiquet|dlc|perim|expir/.test(low)){
    botSay('📋 C’est noté. Dans la vraie version, je génère l’étiquette avec la DLC calculée automatiquement (ex. +3 j pour un produit entamé) et je vous alerte avant expiration.');botSys('Traçabilité DLC mise à jour');return finishBot();
  }
  const q=answerQuestion(low);
  if(q){botSay(q);return finishBot();}
  botSay('Je peux enregistrer vos relevés de température, vos nettoyages, vos étiquettes DLC, et répondre à vos questions réglementaires 😊\nEssayez par exemple : « chambre froide 3 degrés ».');
  return finishBot();
}
function processReading(e,temp){
  const conf=e.hot?temp>=e.th:temp<=e.th, disp=(''+temp).replace('.',',');
  pushLog({t:nowLabel(),label:'Relevé '+e.name.toLowerCase()+' · '+disp+' °C',who:CONFIG.manager||'Vous',tone:conf?'ok':'alert'});
  if(conf){botSay('✅ '+e.name+' : '+disp+' °C — conforme (seuil '+e.seuil+'). C’est enregistré.');botSys('Tableau de bord & journal mis à jour');S.chatPending=null;}
  else{botSay('⚠️ '+e.name+' : '+disp+' °C — hors seuil ('+e.seuil+'). Une action corrective est nécessaire : qu’avez-vous fait ? (produit transféré au froid, retiré du service, contrôle du groupe demandé…)');botSys('Écart détecté · tableau de bord mis à jour');S.chatPending={type:'need-action',eqName:e.name};}
  return finishBot();
}
function answerQuestion(low){
  if(/allergen/.test(low))return 'Il y a 14 allergènes à déclaration obligatoire (INCO 1169/2011) : gluten, crustacés, œufs, poissons, arachides, soja, lait, fruits à coque, céleri, moutarde, graines de sésame, sulfites, lupin, mollusques. Ils doivent être indiqués pour chaque préparation.';
  if(/vitrine/.test(low))return 'Une vitrine réfrigérée se tient à ≤ 4 °C. Au-delà, il faut agir et tracer une action corrective — je m’en occupe si vous me signalez l’écart.';
  if(/congel/.test(low))return 'Un congélateur doit être maintenu à ≤ -18 °C.';
  if((/chambre froide|frigo/.test(low)))return 'Une chambre froide positive se tient à ≤ 4 °C (≤ 3 °C pour les viandes). Le congélateur, lui, à ≤ -18 °C.';
  if(/dlc/.test(low))return 'La DLC (« à consommer jusqu’au ») concerne les produits périssables. Un produit entamé reçoit souvent une durée plus courte. KLÉO génère l’étiquette et vous alerte avant expiration.';
  if(/controle|ddpp|inspect/.test(low))return 'Lors d’un contrôle DDPP, présentez le Mode Inspecteur : conformité, relevés, nettoyages et dossier PDF scellé sont prêts. Tout est horodaté et inviolable.';
  if(/temp/.test(low)&&/(seuil|combien|quelle|quel)/.test(low))return 'Seuils usuels : chambre froide ≤ 4 °C, congélateur ≤ -18 °C, vitrine ≤ 4 °C, maintien au chaud ≥ 63 °C. Je les adapte à votre établissement.';
  return null;
}

document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey&&e.target&&e.target.id==='chatinput'){e.preventDefault();sendChat(e.target.value);}
});

(async function init(){
  await loadConfig();
  S=load();
  if(!METIERS[S.metier])S.metier=CONFIG.metier||'restaurant';
  if(document.title.indexOf('KLÉO')===0 && CONFIG.client&&CONFIG.client.name)document.title='KLÉO — '+CONFIG.client.name;
  renderNav();render();
})();
if('serviceWorker' in navigator && window.top===window.self){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
