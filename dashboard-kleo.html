<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KLÉO — Hygiène & HACCP</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='g' x1='0' y1='0' x2='64' y2='64'><stop stop-color='%233CF0AC'/><stop offset='1' stop-color='%230FB6A8'/></linearGradient></defs><circle cx='32' cy='32' r='30' fill='url(%23g)'/><path d='M22 33l7 7 14-15' stroke='%2306241A' stroke-width='7' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#070B0A">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070B0A;--panel:rgba(255,255,255,.035);--panel-strong:rgba(255,255,255,.055);
    --stroke:rgba(255,255,255,.08);--stroke-soft:rgba(255,255,255,.05);
    --txt:#EAF2EF;--txt-dim:#8A9A95;--txt-faint:#5A6B66;
    --mint:#34E0A1;--teal:#14C8C8;--amber:#FFB547;--red:#FF5C6C;
    --grad:linear-gradient(135deg,#34E0A1 0%,#10B981 55%,#0FB6A8 100%);
    --grad-soft:linear-gradient(135deg,rgba(52,224,161,.16),rgba(16,185,129,.06));
    --r:22px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:'Inter',system-ui,sans-serif;background:radial-gradient(1200px 700px at 85% -10%,rgba(16,185,129,.13),transparent 60%),radial-gradient(900px 600px at -5% 110%,rgba(20,200,200,.09),transparent 55%),var(--bg);color:var(--txt);overflow-x:hidden;-webkit-font-smoothing:antialiased}
  h1,h2,h3,.brand-name,.kpi-num,.score-num,.big-num{font-family:'Sora',sans-serif}
  .app{display:grid;grid-template-columns:264px 1fr;min-height:100vh}

  /* SIDEBAR */
  .side{border-right:1px solid var(--stroke-soft);background:linear-gradient(180deg,rgba(255,255,255,.02),transparent);padding:26px 18px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;overflow-y:auto}
  .brand{display:flex;align-items:center;gap:12px;padding:4px 8px 22px}
  .logo-mark{width:42px;height:42px;flex-shrink:0;filter:drop-shadow(0 6px 14px rgba(52,224,161,.35))}
  .brand-name{font-size:23px;font-weight:800;letter-spacing:.5px;line-height:1}
  .brand-sub{font-size:10px;color:var(--txt-faint);letter-spacing:2.5px;text-transform:uppercase;margin-top:3px}
  .nav-label{font-size:10px;letter-spacing:1.8px;text-transform:uppercase;color:var(--txt-faint);padding:14px 12px 6px}
  .nav-item{display:flex;align-items:center;gap:13px;padding:11px 14px;border-radius:13px;color:var(--txt-dim);font-size:14px;font-weight:500;cursor:pointer;transition:.2s;border:1px solid transparent;position:relative}
  .nav-item svg{width:18px;height:18px;flex-shrink:0;opacity:.85}
  .nav-item:hover{background:var(--panel);color:var(--txt)}
  .nav-item.active{background:var(--grad-soft);color:#fff;border-color:rgba(52,224,161,.22)}
  .nav-item.active::before{content:"";position:absolute;left:-18px;top:50%;transform:translateY(-50%);width:3px;height:22px;background:var(--grad);border-radius:0 4px 4px 0}
  .nav-item .badge{margin-left:auto;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;min-width:19px;height:19px;border-radius:10px;display:grid;place-items:center;padding:0 6px}
  .nav-item .star{margin-left:auto;font-size:10px;color:var(--amber)}
  .side-foot{margin-top:auto;padding:13px;border-radius:16px;background:var(--panel);border:1px solid var(--stroke-soft);display:flex;align-items:center;gap:11px}
  .av{width:38px;height:38px;border-radius:12px;background:var(--grad);display:grid;place-items:center;font-weight:700;color:#04140E;font-family:'Sora';flex-shrink:0;font-size:14px}
  .side-foot .nm{font-size:13.5px;font-weight:600}.side-foot .rl{font-size:11px;color:var(--txt-faint)}

  /* MAIN */
  .main{padding:28px 38px 60px;max-width:1340px}
  .topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:16px;flex-wrap:wrap}
  .topbar-left{display:flex;align-items:center;gap:18px}
  .client-logo{width:60px;height:60px;border-radius:16px;flex-shrink:0;cursor:pointer;position:relative;overflow:hidden;border:1px solid var(--stroke);background:var(--panel-strong);display:grid;place-items:center;transition:.2s}
  .client-logo:hover{border-color:rgba(52,224,161,.4)}
  .client-logo img{width:100%;height:100%;object-fit:cover}
  .client-logo .initials{font-family:'Sora';font-weight:800;font-size:21px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .client-logo .edit{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.7);font-size:8px;text-align:center;padding:2px 0;color:var(--mint);letter-spacing:.5px;opacity:0;transition:.2s}
  .client-logo:hover .edit{opacity:1}
  .hello{font-size:13px;color:var(--txt-dim);display:flex;align-items:center;gap:9px}
  .live-dot{width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 4px rgba(52,224,161,.18);animation:pulse 2.4s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 4px rgba(52,224,161,.18)}50%{box-shadow:0 0 0 8px rgba(52,224,161,.05)}}
  .topbar h1{font-size:26px;font-weight:700;margin-top:6px;letter-spacing:-.5px;display:flex;align-items:center;gap:12px}
  .topbar h1 b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .trade-chip{display:inline-flex;align-items:center;gap:7px;font-family:'Inter';font-size:12.5px;font-weight:600;color:var(--txt-dim);background:var(--panel-strong);border:1px solid var(--stroke);padding:6px 12px;border-radius:30px}
  .trade-chip svg{width:15px;height:15px;color:var(--mint)}
  .top-right{display:flex;align-items:center;gap:12px}
  .clock{text-align:right}.clock .t{font-family:'Sora';font-size:21px;font-weight:600}.clock .d{font-size:12px;color:var(--txt-faint);text-transform:capitalize}
  .btn-export{display:flex;align-items:center;gap:10px;background:var(--grad);color:#04140E;border:none;padding:14px 22px;border-radius:15px;font-family:'Sora';font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 14px 34px -10px rgba(52,224,161,.55);transition:.25s}
  .btn-export:hover{transform:translateY(-2px);box-shadow:0 20px 44px -10px rgba(52,224,161,.7)}
  .btn-export svg{width:18px;height:18px}

  /* CONFIG BAR */
  .config{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:linear-gradient(135deg,rgba(52,224,161,.06),rgba(255,255,255,.02));border:1px dashed rgba(52,224,161,.28);border-radius:18px;padding:13px 18px;margin-bottom:24px}
  .config .lab{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mint);font-weight:700;display:flex;align-items:center;gap:7px}
  .config .lab svg{width:15px;height:15px}
  .config .sep{width:1px;height:26px;background:var(--stroke)}
  .trades{display:flex;gap:8px;flex-wrap:wrap}
  .t-btn{display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--stroke);color:var(--txt-dim);padding:8px 13px;border-radius:12px;font-size:12.5px;font-weight:600;cursor:pointer;transition:.2s;font-family:'Inter'}
  .t-btn svg{width:15px;height:15px}
  .t-btn:hover{color:var(--txt);border-color:rgba(52,224,161,.3)}
  .t-btn.active{background:var(--grad-soft);color:#fff;border-color:rgba(52,224,161,.45)}
  .t-btn.active svg{color:var(--mint)}
  .name-in{background:var(--panel);border:1px solid var(--stroke);color:var(--txt);padding:9px 13px;border-radius:12px;font-size:13px;font-family:'Inter';font-weight:500;min-width:180px;outline:none;transition:.2s}
  .name-in:focus{border-color:rgba(52,224,161,.45)}
  .logo-btn{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--stroke);color:var(--txt-dim);padding:9px 14px;border-radius:12px;font-size:12.5px;font-weight:600;cursor:pointer;transition:.2s}
  .logo-btn:hover{color:var(--mint);border-color:rgba(52,224,161,.3)}.logo-btn svg{width:15px;height:15px}

  /* shared */
  .card{background:var(--panel);border:1px solid var(--stroke);border-radius:var(--r);backdrop-filter:blur(14px);position:relative;overflow:hidden}
  .panel{padding:24px}
  .view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
  .view-head h2{font-size:23px;font-weight:700;letter-spacing:-.4px}
  .view-head .sub{font-size:13.5px;color:var(--txt-dim);margin-top:5px;max-width:600px;line-height:1.5}
  .btn{display:inline-flex;align-items:center;gap:9px;border-radius:13px;font-weight:600;font-size:13.5px;cursor:pointer;transition:.2s;border:1px solid var(--stroke);background:var(--panel);color:var(--txt);padding:11px 17px;font-family:'Inter'}
  .btn:hover{border-color:rgba(52,224,161,.4);color:#fff}.btn svg{width:16px;height:16px}
  .btn.primary{background:var(--grad);color:#04140E;border:none;box-shadow:0 12px 30px -12px rgba(52,224,161,.6)}
  .btn.primary:hover{transform:translateY(-1px);color:#04140E}
  .panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
  .panel-head h3{font-size:16px;font-weight:600;letter-spacing:-.2px;display:flex;align-items:center;gap:10px}
  .panel-head h3 .dot{width:8px;height:8px;border-radius:50%;background:var(--mint)}
  .panel-head .more{font-size:12.5px;color:var(--txt-dim);cursor:pointer;display:flex;align-items:center;gap:5px}
  .panel-head .more:hover{color:var(--mint)}
  .pill{font-size:11px;font-weight:700;padding:5px 11px;border-radius:30px;letter-spacing:.3px;white-space:nowrap}
  .pill.ok{background:rgba(52,224,161,.13);color:var(--mint)}.pill.warn{background:rgba(255,181,71,.14);color:var(--amber)}.pill.bad{background:rgba(255,92,108,.14);color:var(--red)}
  .pill.info{background:rgba(20,200,200,.13);color:var(--teal)}
  .v.ok{color:var(--mint)}.v.warn{color:var(--amber)}.v.bad{color:var(--red)}
  .grid-2{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;margin-top:18px}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
  .fade{animation:fade .45s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* dashboard */
  .hero{display:grid;grid-template-columns:1.05fr 1.4fr;gap:18px;margin-bottom:18px}
  .score-card{padding:30px;display:flex;align-items:center;gap:30px}
  .score-card::after{content:"";position:absolute;inset:0;background:var(--grad-soft);opacity:.6;pointer-events:none}
  .ring{position:relative;width:172px;height:172px;flex-shrink:0;z-index:1}.ring svg{transform:rotate(-90deg)}
  .ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .score-num{font-size:46px;font-weight:800;line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .score-num span{font-size:20px}
  .score-lbl{font-size:11px;color:var(--txt-dim);letter-spacing:1.5px;text-transform:uppercase;margin-top:5px}
  .score-info{z-index:1}
  .score-info .tag{display:inline-flex;align-items:center;gap:7px;background:rgba(52,224,161,.14);color:var(--mint);font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:30px;border:1px solid rgba(52,224,161,.25)}
  .score-info h2{font-size:22px;font-weight:700;margin:14px 0 8px;letter-spacing:-.3px}
  .score-info p{font-size:13.5px;color:var(--txt-dim);line-height:1.6;max-width:330px}
  .score-meta{display:flex;gap:22px;margin-top:18px}
  .score-meta div{font-size:12px;color:var(--txt-faint)}
  .score-meta b{display:block;font-family:'Sora';font-size:17px;color:var(--txt);font-weight:600;margin-bottom:2px}
  .kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
  .kpi{padding:20px 22px;display:flex;flex-direction:column;gap:2px;position:relative}
  .kpi .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;margin-bottom:12px}
  .kpi .ico svg{width:20px;height:20px}
  .ico.g{background:rgba(52,224,161,.12);color:var(--mint)}.ico.b{background:rgba(20,200,200,.12);color:var(--teal)}.ico.a{background:rgba(255,181,71,.12);color:var(--amber)}.ico.r{background:rgba(255,92,108,.12);color:var(--red)}
  .kpi-num{font-size:30px;font-weight:700;line-height:1}.kpi-num small{font-size:15px;color:var(--txt-faint);font-weight:500}
  .kpi-lbl{font-size:12.5px;color:var(--txt-dim);margin-top:5px}
  .kpi-trend{position:absolute;top:20px;right:22px;font-size:11.5px;font-weight:600}.kpi-trend.up{color:var(--mint)}.kpi-trend.warn{color:var(--amber)}

  /* temp rows */
  .temp-row{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--stroke-soft)}
  .temp-row:last-child{border-bottom:none}
  .temp-ico{width:42px;height:42px;border-radius:13px;background:var(--panel-strong);display:grid;place-items:center;flex-shrink:0;border:1px solid var(--stroke-soft)}
  .temp-ico svg{width:21px;height:21px;color:var(--teal)}
  .temp-name{font-size:14.5px;font-weight:600}.temp-sub{font-size:11.5px;color:var(--txt-faint);margin-top:2px}
  .temp-val{margin-left:auto;text-align:right}.temp-val .v{font-family:'Sora';font-size:19px;font-weight:700}.temp-val .range{font-size:11px;color:var(--txt-faint)}

  /* checklist */
  .check{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--stroke-soft);cursor:pointer;transition:.18s}
  .check:last-child{border-bottom:none}.check:hover{padding-left:4px}
  .box{width:24px;height:24px;border-radius:8px;border:2px solid var(--stroke);flex-shrink:0;display:grid;place-items:center;transition:.2s}
  .box svg{width:14px;height:14px;color:#04140E;opacity:0;transform:scale(.4);transition:.2s}
  .check.done .box{background:var(--grad);border-color:transparent}.check.done .box svg{opacity:1;transform:scale(1)}
  .check.done .ck-name{color:var(--txt-faint);text-decoration:line-through}
  .ck-name{font-size:14px;font-weight:500;transition:.2s}.ck-sub{font-size:11px;color:var(--txt-faint);margin-top:2px}
  .ck-time{margin-left:auto;font-size:11.5px;color:var(--txt-faint)}
  .progress-bar{height:8px;background:var(--panel-strong);border-radius:10px;overflow:hidden;margin-top:4px;margin-bottom:18px}
  .progress-fill{height:100%;background:var(--grad);border-radius:10px;width:0;transition:width 1s cubic-bezier(.16,1,.3,1)}
  .progress-meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--txt-dim);margin-bottom:6px}

  /* alerts */
  .alert{display:flex;gap:13px;padding:14px;border-radius:15px;background:var(--panel-strong);border:1px solid var(--stroke-soft);margin-bottom:11px;align-items:flex-start}
  .alert:last-child{margin-bottom:0}.alert .bar{width:3px;align-self:stretch;border-radius:4px;flex-shrink:0}
  .alert.a .bar{background:var(--amber)}.alert.r .bar{background:var(--red)}.alert.i .bar{background:var(--teal)}
  .alert .ttl{font-size:13.5px;font-weight:600}.alert .desc{font-size:12px;color:var(--txt-dim);margin-top:3px;line-height:1.5}.alert .when{font-size:11px;color:var(--txt-faint);margin-top:6px}

  /* tabs */
  .tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
  .tab{padding:9px 16px;border-radius:11px;background:var(--panel);border:1px solid var(--stroke);color:var(--txt-dim);font-size:13px;font-weight:600;cursor:pointer;transition:.2s}
  .tab:hover{color:var(--txt)}.tab.active{background:var(--grad-soft);color:#fff;border-color:rgba(52,224,161,.4)}

  /* doc cards / coffre */
  .doc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .doc{padding:20px;display:flex;flex-direction:column;gap:10px}
  .doc .dico{width:44px;height:44px;border-radius:13px;background:var(--panel-strong);border:1px solid var(--stroke-soft);display:grid;place-items:center}
  .doc .dico svg{width:21px;height:21px;color:var(--mint)}
  .doc .dn{font-size:14.5px;font-weight:600}.doc .dd{font-size:11.5px;color:var(--txt-faint);line-height:1.4}
  .doc .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:8px}

  /* inspection */
  .insp-chapter{margin-bottom:14px}
  .insp-head{display:flex;align-items:center;gap:12px;padding:13px 16px;background:var(--panel-strong);border:1px solid var(--stroke-soft);border-radius:14px;cursor:pointer}
  .insp-head .cn{font-size:14.5px;font-weight:600}.insp-head .cs{margin-left:auto;font-family:'Sora';font-weight:700;font-size:14px}
  .insp-item{display:flex;align-items:center;gap:13px;padding:11px 16px;border-bottom:1px solid var(--stroke-soft)}
  .insp-item:last-child{border-bottom:none}
  .insp-item .iname{font-size:13.5px;font-weight:500}
  .toggle{margin-left:auto;display:flex;gap:6px}
  .tg{padding:5px 11px;border-radius:9px;font-size:11.5px;font-weight:700;cursor:pointer;border:1px solid var(--stroke);color:var(--txt-faint);transition:.15s}
  .tg.ok.on{background:rgba(52,224,161,.16);color:var(--mint);border-color:rgba(52,224,161,.4)}
  .tg.no.on{background:rgba(255,92,108,.16);color:var(--red);border-color:rgba(255,92,108,.4)}

  /* sites */
  .site-row{display:flex;align-items:center;gap:16px;padding:16px;border-radius:15px;background:var(--panel-strong);border:1px solid var(--stroke-soft);margin-bottom:12px}
  .site-row .sav{width:44px;height:44px;border-radius:12px;background:var(--grad);display:grid;place-items:center;font-family:'Sora';font-weight:700;color:#04140E;flex-shrink:0}
  .site-mini{width:90px;height:8px;background:var(--panel);border-radius:8px;overflow:hidden}
  .site-mini > div{height:100%;background:var(--grad);border-radius:8px}

  /* table */
  .tbl{width:100%;border-collapse:collapse}
  .tbl th{text-align:left;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--txt-faint);font-weight:600;padding:0 14px 12px}
  .tbl td{padding:13px 14px;border-top:1px solid var(--stroke-soft);font-size:13.5px}
  .tbl tr:hover td{background:var(--panel-strong)}

  /* big action */
  .dossier-hero{padding:34px;display:flex;align-items:center;gap:30px;flex-wrap:wrap}
  .dossier-hero::after{content:"";position:absolute;inset:0;background:var(--grad-soft);opacity:.5;pointer-events:none}
  .big-num{font-size:52px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
  .incl{display:flex;align-items:center;gap:10px;font-size:13.5px;padding:8px 0}
  .incl svg{width:18px;height:18px;color:var(--mint);flex-shrink:0}

  /* ===== PORTAIL / ACCUEIL ===== */
  .portal-hero{padding:36px 40px;display:flex;align-items:center;justify-content:space-between;gap:36px;flex-wrap:wrap;margin-bottom:8px}
  .portal-hero::after{content:"";position:absolute;inset:0;background:var(--grad-soft);opacity:.55;pointer-events:none}
  .ph-left{z-index:1;max-width:580px;flex:1;min-width:280px}
  .ph-greet{font-size:12.5px;color:var(--txt-dim);display:flex;align-items:center;gap:9px;text-transform:capitalize}
  .ph-title{font-family:'Sora';font-size:34px;font-weight:800;letter-spacing:-.7px;margin:10px 0 12px;line-height:1.12}
  .ph-title b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .ph-sub{font-size:14.5px;color:var(--txt-dim);line-height:1.6}
  .ph-cta{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap}
  .cta{display:flex;align-items:center;gap:11px;padding:15px 20px;border-radius:15px;font-weight:700;font-size:14px;cursor:pointer;font-family:'Sora';transition:.2s}
  .cta svg{width:18px;height:18px}
  .cta.primary{background:var(--grad);color:#04140E;box-shadow:0 14px 34px -12px rgba(52,224,161,.55)}
  .cta.primary:hover{transform:translateY(-2px)}
  .cta.ghost{background:var(--panel-strong);border:1px solid var(--stroke);color:var(--txt)}
  .cta.ghost:hover{border-color:rgba(52,224,161,.4);color:#fff}
  .ph-ring{position:relative;width:158px;height:158px;flex-shrink:0;z-index:1}

function parseTarget(r){
  if(/en\s|<2h|glace|sec|échantillon|contrôle|livraison/i.test(r))return null;
  let s=r.replace('°C','').replace(/[−–]/g,'-').replace(/\s/g,'').replace(/\+/g,'');
  if(s.includes('→')){const p=s.split('→').map(parseFloat);if(p.every(x=>!isNaN(x)))return{min:Math.min(...p),max:Math.max(...p)};return null;}
  if(s[0]==='≤'||s[0]==='<'){const v=parseFloat(s.slice(1));return isNaN(v)?null:{max:v}}
  if(s[0]==='≥'||s[0]==='>'){const v=parseFloat(s.slice(1));return isNaN(v)?null:{min:v}}
  return null;
}

/* ===== CALENDRIER & HISTORIQUE ===== */
const MONTHS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const TODAY={y:2026,m:5,d:9};
function fmtDate(off){const d=new Date(2026,5,9);d.setDate(d.getDate()+off);return d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});}
function dayStat(y,m,d){
  if(y>TODAY.y||(y===TODAY.y&&m>TODAY.m)||(y===TODAY.y&&m===TODAY.m&&d>TODAY.d))return 'future';
  if(y===TODAY.y&&m===TODAY.m&&d===TODAY.d)return 'today';
  if(d%19===0)return 'bad'; if(d%7===0)return 'warn'; return 'ok';
}
function spark(status){
  const col=status==='warn'?'#FFB547':status==='bad'?'#FF5C6C':'#34E0A1';
  let pts='';for(let i=0;i<14;i++){const x=(i/13*116+2);let y=16+Math.sin(i*0.85)*6+((i*7)%5-2);if(status==='warn'&&i>10)y-=6;pts+=x.toFixed(0)+','+Math.max(3,Math.min(29,y)).toFixed(0)+' ';}
  return '<svg width="100%" height="34" viewBox="0 0 120 34" preserveAspectRatio="none" style="margin-top:6px"><polyline points="'+pts+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/></svg>';
}
function dayDetail(d){
  const {y,m}=calRef;const s=dayStat(y,m,d);const dateStr=d+' '+MONTHS[m]+' '+y;
  if(s==='future')return '<div class="panel-head"><h3><span class="dot" style="background:var(--txt-faint)"></span> '+dateStr+'</h3></div><p style="font-size:13px;color:var(--txt-dim)">Jour à venir — aucune donnée enregistrée.</p>';
  const t=T();const score=s==='warn'?89:s==='bad'?72:t.score;const sc=s==='bad'?'bad':s==='warn'?'warn':'ok';
  const okT=t.temps.filter(x=>x[5]==='ok').length+((s==='ok'||s==='today')?1:0);
  return '<div class="panel-head"><h3><span class="dot"></span> '+dateStr+((s==='today')?' · aujourd\'hui':'')+'</h3><span class="pill '+sc+'">'+(sc==='ok'?'Conforme':sc==='warn'?'Écart mineur':'Non-conformité')+'</span></div>'
   +'<div style="display:flex;align-items:center;gap:16px;margin:6px 0 16px"><div class="v '+sc+'" style="font-family:Sora;font-size:38px;font-weight:800">'+score+'%</div><div style="font-size:12.5px;color:var(--txt-dim)">Score de conformité<br>de la journée</div></div>'
   +[['Relevés de température',Math.min(okT,t.temps.length)+' / '+t.temps.length+' conformes',sc==='bad'?'bad':'ok'],
     ['Plans de nettoyage',((s==='ok'||s==='today')?t.checks.length:t.checks.length-1)+' / '+t.checks.length+' réalisés','ok'],
     ['Écarts & actions',(s==='ok'||s==='today')?'0':(s==='warn'?'1 · action corrective tracée':'2 · actions correctives tracées'),sc],
     ['Saisies à temps','100 %','ok']]
     .map(r=>'<div style="display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--stroke-soft)"><span style="font-size:13.5px">'+r[0]+'</span><span class="pill '+r[2]+'">'+r[1]+'</span></div>').join('')
   +'<button class="btn" style="margin-top:16px;width:100%;justify-content:center" onclick="toast(\'Journée du '+dateStr+' exportée 📄\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/></svg>Exporter cette journée</button>';
}
function vCalendrier(){
  const {y,m}=calRef;const first=(new Date(y,m,1).getDay()+6)%7;const days=new Date(y,m+1,0).getDate();
  let okc=0,warnc=0,badc=0;
  for(let d=1;d<=days;d++){const s=dayStat(y,m,d);if(s==='ok'||s==='today')okc++;else if(s==='warn')warnc++;else if(s==='bad')badc++;}
  let cells='';for(let i=0;i<first;i++)cells+='<div class="cal-cell empty"></div>';
  for(let d=1;d<=days;d++){const s=dayStat(y,m,d);cells+='<div class="cal-cell '+s+((d===calSel)?' sel':'')+'" '+((s!=='future')?'onclick="calPick(this,'+d+')"':'')+'><span class="cd">'+d+'</span>'+((s!=='future')?'<span class="cdot '+s+'"></span>':'')+'</div>';}
  return '<div class="view-head"><div><h2>Calendrier & historique</h2><div class="sub">Tout votre historique de conformité, jour par jour. Cliquez sur une date pour revoir les relevés, le nettoyage et les écarts — et exportez n\'importe quelle période pour un contrôle.</div></div></div>'
   +'<div class="grid-3" style="margin-bottom:18px">'
   +'<div class="card kpi fade"><div class="ico g"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg></div><div class="kpi-num" data-count="'+okc+'">0</div><div class="kpi-lbl">Jours conformes ce mois</div></div>'
   +'<div class="card kpi fade"><div class="ico a"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/></svg></div><div class="kpi-num" data-count="'+warnc+'">0</div><div class="kpi-lbl">Jours avec écart mineur</div></div>'
   +'<div class="card kpi fade"><div class="ico r"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg></div><div class="kpi-num" data-count="'+badc+'">0</div><div class="kpi-lbl">Non-conformités</div></div>'
   +'</div>'
   +'<div class="grid-2"><div class="card panel fade">'
   +'<div class="cal-head"><div class="cal-nav"><button onclick="calNav(-1)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg></button><button onclick="calNav(1)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg></button></div><h3 style="font-size:17px;text-transform:capitalize">'+MONTHS[m]+' '+y+'</h3><div style="display:flex;gap:12px;font-size:11px;color:var(--txt-faint)"><span><span class="cdot ok" style="display:inline-block;margin-right:4px"></span>conforme</span><span><span class="cdot warn" style="display:inline-block;margin-right:4px"></span>écart</span></div></div>'
   +'<div class="cal-week"><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span></div>'
   +'<div class="cal-grid">'+cells+'</div></div>'
   +'<div class="card panel fade" id="dayDetail">'+dayDetail(calSel)+'</div></div>';
}
function calPick(el,d){calSel=d;document.querySelectorAll('.cal-cell').forEach(c=>c.classList.remove('sel'));el.classList.add('sel');document.getElementById('dayDetail').innerHTML=dayDetail(d);}
function calNav(delta){let m=calRef.m+delta,y=calRef.y;if(m<0){m=11;y--;}if(m>11){m=0;y++;}calRef={y:y,m:m};calSel=1;go('calendrier');}
function tempNav(delta){
  if(delta===0)tempOffset=0;else tempOffset=Math.min(0,tempOffset+delta);
  const lbl=document.getElementById('tempDateLbl'),arch=document.getElementById('tempArch');if(!lbl)return;
  lbl.textContent=(tempOffset===0?"aujourd'hui · ":"")+fmtDate(tempOffset);

}

function go(view){
  currentView=view;
  document.querySelectorAll('.nav-item[data-v]').forEach(n=>n.classList.toggle('active',n.dataset.v===view));
  const c=document.getElementById('content'); c.innerHTML=VIEWS[view]();

  if(view==='accueil'){animateScore('score',T().score);}
  if(view==='dashboard'){animateScore('score',T().score);bindChecks();animateKpis();initProgress();}
  if(view==='nettoyage'){bindChecks();initProgress(true);}
  if(view==='inspecteur'){bindInspection();}
  if(['temperatures','multisites','calendrier'].includes(view))animateKpis();
  if(view==='temperatures')tempNav(0);
}

function initProgress(all){
  const fill=document.getElementById('ckFill');if(!fill)return;
  const checks=document.querySelectorAll('.check');const done=document.querySelectorAll('.check.done').length;
  const pct=Math.round(done/checks.length*100);
  const cc=document.getElementById('ckCount'),cp=document.getElementById('ckPct');
  if(cc)cc.textContent=done+' / '+checks.length; if(cp)cp.textContent=pct+' %';
  setTimeout(()=>fill.style.width=pct+'%',100);
}
function bindChecks(){
  document.querySelectorAll('.check').forEach(c=>c.addEventListener('click',()=>{
    c.classList.toggle('done');const checks=document.querySelectorAll('.check');const done=document.querySelectorAll('.check.done').length;
    const pct=Math.round(done/checks.length*100);
    const cc=document.getElementById('ckCount'),cp=document.getElementById('ckPct'),f=document.getElementById('ckFill');
    if(cc)cc.textContent=done+' / '+checks.length; if(cp)cp.textContent=pct+' %'; if(f)f.style.width=pct+'%';
    const tm=c.querySelector('.ck-time'); if(tm&&c.classList.contains('done')&&(tm.textContent==='à faire'))tm.textContent=now();
    saveNett();
  }));
}
function bindInspection(){
  function recalc(){
    const ids=Object.keys(inspState);const ok=ids.filter(i=>inspState[i]).length;
    animateScore('inspScore',Math.round(ok/ids.length*100),true);
  }
  document.querySelectorAll('.tg').forEach(t=>t.addEventListener('click',()=>{
    const id=t.dataset.id;inspState[id]=t.dataset.val==='1';
    document.querySelectorAll('.tg[data-id="'+id+'"]').forEach(x=>x.classList.toggle('on',x.dataset.val===t.dataset.val));
    recalc();
  }));
  animateScore('inspScore',100,true);
}
function animateKpis(){document.querySelectorAll('.kpi-num').forEach((el,i)=>setTimeout(()=>{
  const target=+el.dataset.count,small=el.dataset.small||'';let t0=performance.now();
  function step(n){const p=Math.min((n-t0)/1100,1);const e=1-Math.pow(1-p,3);el.innerHTML=Math.round(target*e)+(small?'<small>'+small+'</small>':'');if(p<1)requestAnimationFrame(step);}requestAnimationFrame(step);
},i*90));}
function animateScore(id,score,instant){
  const numEl=document.getElementById(id),ring=document.getElementById('ringFill');if(!numEl)return;
  let t0=performance.now();const dur=instant?500:1400;
  function step(now){const p=Math.min((now-t0)/dur,1);const e=1-Math.pow(1-p,3);numEl.textContent=Math.round(score*e);if(ring)ring.style.strokeDashoffset=465-465*(score*e)/100;if(p<1)requestAnimationFrame(step);}
  requestAnimationFrame(step);
}

/* ============ INIT ============ */
// nav
let navHtml='';NAV.forEach(n=>{if(n.section){navHtml+=`<div class="nav-label" style="${n.section==='Pilotage'?'display:none':''}">${n.section}</div>`;}
  else navHtml+=`<div class="nav-item" data-v="${n.v}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${n.i}</svg>${n.t}${n.badge?'<span class="badge" id="navBadge">2</span>':n.star?'<span class="star">★</span>':''}</div>`;});
document.getElementById('nav').innerHTML=navHtml;
document.querySelectorAll('.nav-item[data-v]').forEach(n=>n.addEventListener('click',()=>go(n.dataset.v)));

// trades
document.getElementById('trades').innerHTML=Object.entries(TRADES).map(([k,t])=>`<button class="t-btn" data-k="${k}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${t.icon}</svg>${t.label}</button>`).join('');
document.querySelectorAll('.t-btn').forEach(b=>b.addEventListener('click',()=>setTrade(b.dataset.k)));

// name edit
document.getElementById('nameInput').addEventListener('input',applyIdentity);
// logo
document.getElementById('logoInput').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{logoData=ev.target.result;document.getElementById('clientLogo').innerHTML='<img src="'+logoData+'"><span class="edit">CHANGER</span>';};r.readAsDataURL(f);});

// helpers
function now(){return new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}
function toast(msg){let t=document.createElement('div');t.textContent=msg;t.style.cssText='position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);background:linear-gradient(135deg,#34E0A1,#0FB6A8);color:#04140E;font-weight:700;font-family:Sora;padding:14px 24px;border-radius:14px;box-shadow:0 16px 40px -12px rgba(52,224,161,.6);z-index:999;opacity:0;transition:.3s';document.body.appendChild(t);requestAnimationFrame(()=>{t.style.opacity=1;t.style.transform='translateX(-50%) translateY(0)';});setTimeout(()=>{t.style.opacity=0;t.style.transform='translateX(-50%) translateY(20px)';setTimeout(()=>t.remove(),300);},2200);}
function exportDossier(e){const b=e.currentTarget,orig=b.innerHTML;b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="animation:spin 1s linear infinite"><path d="M21 12a9 9 0 1 1-6.2-8.5"/></svg> Génération…';setTimeout(()=>{b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg> Dossier prêt ✓';toast('Dossier de contrôle généré 📄✓');setTimeout(()=>b.innerHTML=orig,2500);},1600);}

// clock
function tick(){const n=new Date();document.getElementById('clock').textContent=n.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});document.getElementById('date').textContent=n.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});}
tick();setInterval(tick,30000);
const st=document.createElement('style');st.textContent='@keyframes spin{to{transform:rotate(360deg)}}';document.head.appendChild(st);

// PWA — service worker (offline + installable)
if('serviceWorker' in navigator){try{navigator.serviceWorker.register('/sw.js').catch(()=>{});}catch(e){}}

// GO
applyIdentity();
window.addEventListener('load',()=>setTimeout(()=>go('accueil'),200));
go('accueil');
</script>
</body>
</html>
